<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Maths">
<meta name="theme-color" content="#7cc8f2">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Little Easier – Maths</title>
<style>
/* Layout: full-bleed pixel scene per world (sky layer on top, ground layer at the bottom), Calm-style header (wordmark left, round glass buttons right), one centred "card" for every screen, grown-ups lock bottom-left. Worlds swap colour tokens on body[data-theme]. */
:root{
  --font-ui: ui-rounded, 'SF Pro Rounded', 'Nunito', 'Varela Round', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --s: 56px;
  color-scheme: light;
}
body[data-theme=blocks]{--sky1:#7cc8f2;--sky2:#d9f1ff;--panel:#fbf7ec;--edge:#dccca6;--edge2:#bba779;--ink:#2a2a22;--muted:#6b6a5c;--accent:#5fa832;--accent2:#3f7a22;--accentInk:#fff;--soft:#f0e7d0;--glass:rgba(255,255,255,.62);--glassInk:#2a2a22;--hl:#ffd84f;--hl2:#d39c18;--markc:#2f6a1c}
body[data-theme=space]{--sky1:#090b26;--sky2:#2b1f5e;--panel:#1d1b46;--edge:#3f3892;--edge2:#2a2470;--ink:#f3f1ff;--muted:#b9b4e8;--accent:#8b7fe0;--accent2:#5a4fb4;--accentInk:#fff;--soft:#29265c;--glass:rgba(255,255,255,.14);--glassInk:#f3f1ff;--hl:#ffd84f;--hl2:#c99a10;--markc:#c9c2ff;color-scheme:dark}
body[data-theme=trains]{--sky1:#ffad78;--sky2:#ffe7c6;--panel:#fff8ee;--edge:#e6c6a2;--edge2:#c69c72;--ink:#2d241d;--muted:#75665a;--accent:#d9564a;--accent2:#a3392f;--accentInk:#fff;--soft:#f6e6d2;--glass:rgba(255,255,255,.62);--glassInk:#2d241d;--hl:#ffd84f;--hl2:#d39c18;--markc:#8a2f26}
body[data-theme=dinos]{--sky1:#9fd885;--sky2:#ecf8d6;--panel:#f7fbec;--edge:#c6dba4;--edge2:#9dbb73;--ink:#25301d;--muted:#5f6d52;--accent:#e8893a;--accent2:#b0601f;--accentInk:#fff;--soft:#e9f2d6;--glass:rgba(255,255,255,.62);--glassInk:#25301d;--hl:#ffd84f;--hl2:#d39c18;--markc:#2d5a17}
html,body{height:100%}
body{margin:0;font-family:var(--font-ui);color:var(--ink);background:linear-gradient(var(--sky1),var(--sky2)) fixed;overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button{font-family:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--hl2);outline-offset:3px}
input,select,textarea{-webkit-user-select:text;user-select:text;font-family:inherit}
[hidden]{display:none!important}
svg{display:block}

/* scenery */
#skyL,#groundL{position:fixed;left:0;right:0;pointer-events:none;z-index:0}
#skyL{top:0;height:46vh}
#groundL{bottom:0;height:42vh}
#skyL svg,#groundL svg{width:100%;height:100%}
.cloud{animation:drift 90s linear infinite}
.cloud.b{animation-duration:140s}
@keyframes drift{from{transform:translateX(-30px)}to{transform:translateX(190px)}}
.tw{animation:tw 3.2s ease-in-out infinite}
@keyframes tw{50%{opacity:.25}}
body.still .cloud,body.still .tw{animation:none}

#app{position:relative;z-index:1;height:100%;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top,0px) + 12px) max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));min-height:52px}
.mark{display:flex;flex-direction:column;line-height:1;margin-right:auto}
.mark small{font-size:12px;font-weight:700;color:var(--glassInk);opacity:.75;letter-spacing:.3px}
.mark span{font-size:22px;font-weight:800;color:var(--markc);margin-top:2px}
.round{width:48px;height:48px;border-radius:24px;border:0;background:var(--glass);color:var(--glassInk);display:flex;align-items:center;justify-content:center;flex:none;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);position:relative}
.pill{height:48px;border-radius:24px;border:0;background:var(--glass);color:var(--glassInk);display:flex;align-items:center;gap:8px;padding:0 16px 0 12px;font:800 16px var(--font-ui);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.purse{display:flex;align-items:center;gap:6px;height:48px;padding:0 14px 0 8px;border-radius:24px;background:var(--glass);color:var(--glassInk);font:800 18px var(--font-ui);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.purse .ic{width:30px;height:30px;display:grid;place-items:center}.purse .ic .spr{width:28px;height:auto}
.purse .ic canvas{width:30px;height:30px;image-rendering:pixelated;border-radius:4px}
.purse.bump{animation:bump .45s}
@keyframes bump{40%{transform:scale(1.18)}}
.dots{display:flex;gap:6px;align-items:center;margin-right:auto;flex-wrap:nowrap;min-width:0}
.dots i{width:18px;height:18px;border-radius:5px;background:var(--glass);box-shadow:inset 0 -3px 0 rgba(0,0,0,.12)}
.dots i.on{background:var(--hl);box-shadow:inset 0 -3px 0 var(--hl2)}
.dots i.now{outline:3px solid var(--glassInk);outline-offset:1px;opacity:.9}

#stage{flex:1;min-height:0;display:flex;justify-content:center;align-items:stretch;padding:0 max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 64px) max(16px,env(safe-area-inset-left,0px))}
.card{width:100%;max-width:1000px;box-sizing:border-box;background:var(--panel);border:4px solid var(--edge);border-radius:24px;box-shadow:0 6px 0 var(--edge2);padding:clamp(16px,2.6vw,30px);overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column;align-items:center;gap:16px;align-self:flex-start;max-height:100%}
.card.fill{align-self:stretch}

/* type + buttons */
h1,h2,h3{margin:0}
.hello{text-align:center}
.hello h1{font:800 clamp(30px,5vw,48px)/1.05 var(--font-ui)}
.hello p{margin:6px 0 0;color:var(--muted);font-size:18px;font-weight:600}
.sub{font:800 14px var(--font-ui);letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);align-self:stretch;max-width:860px;margin:6px auto 0;width:100%}
.muted{color:var(--muted);font-weight:600;text-align:center;margin:0}
.btn{border:0;border-radius:18px;padding:12px 26px;min-height:60px;font:800 22px var(--font-ui);background:var(--accent);color:var(--accentInk);box-shadow:0 5px 0 var(--accent2);display:inline-flex;align-items:center;justify-content:center;gap:10px}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--accent2)}
.btn.big{min-height:72px;font-size:28px;padding:12px 44px;border-radius:22px}
.btn.soft{background:var(--soft);color:var(--ink);box-shadow:0 5px 0 var(--edge)}
.btn.soft:active{box-shadow:0 1px 0 var(--edge)}
.btn svg{width:26px;height:26px}
.row{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;align-items:center}

/* home */
.today{width:100%;max-width:860px;box-sizing:border-box;background:var(--soft);border-radius:22px;padding:18px;display:flex;flex-direction:column;align-items:center;gap:16px}
.ft{display:flex;align-items:stretch;justify-content:center;gap:12px;width:100%;flex-wrap:wrap}
.ftb{flex:1 1 220px;max-width:340px;background:var(--panel);border:3px solid var(--edge);border-radius:18px;padding:12px 14px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.ftb small{font:800 13px var(--font-ui);letter-spacing:1.4px;text-transform:uppercase;color:var(--muted)}
.ftb b{font:800 20px/1.15 var(--font-ui)}
.ftjobs{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;min-height:56px;align-items:center}
.ftjobs .spr{width:34px;height:auto}
.ftic{height:56px;display:flex;align-items:center}
.ftic .spr{width:56px;height:auto}.ftic canvas{width:56px;height:56px;image-rendering:pixelated;border-radius:8px}
.ftarrow{align-self:center;width:40px;color:var(--muted);flex:none}
@media (max-width:560px){.ftarrow{transform:rotate(90deg)}.ftb{flex-basis:100%}}
.skills{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;width:100%;max-width:860px}
.sk{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 10px 12px;background:var(--panel);border:3px solid var(--edge);border-radius:18px;box-shadow:0 4px 0 var(--edge);text-align:center}
.sk:active{transform:translateY(3px);box-shadow:0 1px 0 var(--edge)}
.sk .gl{width:64px;height:56px;border-radius:12px;background:var(--accent);color:var(--accentInk);display:grid;place-items:center;font:800 24px var(--font-ui);box-shadow:inset 0 -6px 0 var(--accent2),inset 0 4px 0 rgba(255,255,255,.25)}
.sk b{font:800 17px/1.15 var(--font-ui)}
.sk .pips{display:flex;gap:3px}
.sk .pips i{width:9px;height:9px;border-radius:2px;background:var(--edge)}
.sk .pips i.on{background:var(--hl2)}
.sk.locked{opacity:.45;box-shadow:none}
.sk.locked .gl{background:var(--edge);box-shadow:none}
.buildtile{display:flex;align-items:center;gap:14px;width:100%;max-width:860px;box-sizing:border-box;text-align:left;background:var(--panel);border:3px solid var(--edge);border-radius:18px;padding:12px 16px;box-shadow:0 4px 0 var(--edge)}
.buildtile canvas{width:52px;height:52px;image-rendering:pixelated;border-radius:8px;flex:none}
.buildtile b{font:800 20px var(--font-ui);display:block}
.buildtile span{color:var(--muted);font-weight:600;font-size:15px}
.buildtile.locked{opacity:.55}
.bti{display:flex;gap:4px;flex:none}.bti .spr{width:40px;height:auto}
.newfriend{width:min(150px,40vw);animation:drop .6s cubic-bezier(.3,1.5,.6,1)}.newfriend .spr{width:100%;height:auto}body.still .newfriend{animation:none}

/* setup */
.setup{width:100%;max-width:620px;display:flex;flex-direction:column;gap:16px}
.setup h1{font:800 clamp(28px,4.4vw,40px)/1.1 var(--font-ui);text-align:center}
.setup p{margin:0;color:var(--muted);font-weight:600;text-align:center;line-height:1.4}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font:800 16px var(--font-ui)}
.field input{font-size:20px;font-weight:700;padding:14px 16px;border-radius:14px;border:3px solid var(--edge);background:#fff;color:#222}
.worlds{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px}
.wcard{border:3px solid var(--edge);border-radius:18px;padding:0;overflow:hidden;background:var(--panel);display:flex;flex-direction:column;box-shadow:0 4px 0 var(--edge)}
.wcard .wv{height:92px;display:flex;align-items:flex-end;justify-content:center;gap:4px;padding:8px}
.wcard .wv .spr{width:34px}
.wcard b{font:800 18px var(--font-ui);padding:8px 0 10px}
.wcard.on{border-color:var(--hl2);box-shadow:0 0 0 4px var(--hl),0 4px 0 var(--hl2)}
.promise{font-size:14px!important;background:var(--soft);border-radius:14px;padding:10px 14px}

/* jobs */
.lvl{font:800 13px var(--font-ui);letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:8px}
.lvl i{width:10px;height:10px;border-radius:3px;background:var(--edge)}
.lvl i.on{background:var(--accent)}
.prompt{display:flex;align-items:center;gap:12px;justify-content:center;max-width:860px}
.prompt p{font:800 clamp(22px,3.4vw,34px)/1.25 var(--font-ui);margin:0;text-align:center;text-wrap:balance}
.prompt p span{border-radius:6px;transition:background .15s}
.prompt p span.on{background:var(--hl);color:#2a2a22}
.prompt.small p{font-size:clamp(20px,3vw,28px)}
.speak{width:56px;height:56px;border-radius:28px;border:0;background:var(--accent);color:#fff;display:grid;place-items:center;flex:none;box-shadow:0 4px 0 var(--accent2);position:relative}
.speak svg{width:28px;height:28px}
.speak.wait{opacity:.35;pointer-events:none}
.speak.ready{animation:pulse 1.6s ease-in-out 3}
@keyframes pulse{50%{transform:scale(1.1)}}
.board{display:flex;flex-wrap:wrap;gap:16px 18px;justify-content:center;align-items:center;width:100%;max-width:960px}
.board.locked .it{cursor:default}
.zw{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;max-width:100%}
.zlab{font:800 13px var(--font-ui);letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);min-height:16px}
.zone{position:relative;border-radius:18px;box-sizing:border-box;max-width:100%;transition:box-shadow .15s,transform .15s}
.zin{display:flex;flex-wrap:wrap;justify-content:center;align-items:flex-end;align-content:flex-end;gap:4px 6px;min-height:inherit}
.zone.hot{box-shadow:0 0 0 5px var(--hl),0 0 20px rgba(255,216,79,.8);transform:scale(1.02)}
.zc{position:absolute;top:10px;right:-10px;min-width:40px;height:40px;padding:0 8px;box-sizing:border-box;border-radius:20px;background:var(--accent);color:#fff;font:800 22px/40px var(--font-ui);text-align:center;box-shadow:0 3px 0 var(--accent2);z-index:3}
.tray{border:3px dashed var(--edge2);padding:12px;min-width:min(200px,58vw);max-width:440px;min-height:calc(var(--s) + 30px)}
.box{padding:14px;min-width:min(240px,72vw);max-width:520px;min-height:calc(var(--s) * 1.6 + 28px)}
.box.sm{min-width:min(150px,36vw)}
.box.line .zin,.box.line{flex-wrap:nowrap}
.box.line{min-height:0;padding:10px 14px}
/* world-specific containers */
body[data-theme=blocks] .box{background:repeating-linear-gradient(0deg,#e6d1a6 0 22px,#d9c191 22px 24px);border:6px solid #8d6132;box-shadow:inset 0 0 0 3px #b07f43,0 5px 0 #6b4526}
body[data-theme=space] .box{background:radial-gradient(ellipse at 50% 0%,#4a3fa8,#231e5a 70%);border:5px solid #8b7fe0;border-radius:30px 30px 18px 18px;box-shadow:inset 0 0 18px rgba(139,127,224,.5),0 5px 0 #4b44a0}
body[data-theme=trains] .box{background:#e7eaec;border:6px solid #5f6368;border-radius:10px;box-shadow:inset 0 -6px 0 #cfd3d6,0 5px 0 #45484c;margin-bottom:14px}
body[data-theme=trains] .box::after{content:"";position:absolute;left:12%;right:12%;bottom:-20px;height:16px;background:radial-gradient(circle at 12px 8px,#2f3134 0 7px,#8b8f93 7px 8px,transparent 9px) 0 0/calc(100% - 0px) 16px repeat-x}
body[data-theme=dinos] .box{background:radial-gradient(ellipse at 50% 60%,#f2e2b6,#e0c58a 75%);border:8px solid #8a6a3a;border-radius:50% 50% 44% 44%/30% 30% 50% 50%;box-shadow:inset 0 0 0 3px #b08b52,0 5px 0 #6e5229}
.it{touch-action:none;cursor:grab;line-height:0;padding:3px;border-radius:10px;position:relative}
.it .spr{width:var(--s);height:auto}
.it.lifted{opacity:.2}
.it.fixed{cursor:default}
.it.gone{opacity:.28}
.it.gone::before{content:"";position:absolute;inset:18% 10%;background:linear-gradient(45deg,transparent 45%,var(--ink) 45% 55%,transparent 55%),linear-gradient(-45deg,transparent 45%,var(--ink) 45% 55%,transparent 55%);opacity:.7;z-index:2}
.it.counted,.cell.counted{background:rgba(255,216,79,.6);box-shadow:0 0 0 3px var(--hl)}
.nb{position:absolute;left:50%;top:-20px;transform:translateX(-50%);min-width:28px;height:28px;padding:0 6px;box-sizing:border-box;border-radius:14px;background:var(--accent);color:#fff;font:800 16px/28px var(--font-ui);text-align:center;box-shadow:0 2px 0 var(--accent2);z-index:4;pointer-events:none;animation:popin .3s cubic-bezier(.3,1.6,.6,1)}
.cell .nb{top:-10px}
.nlast .nb{background:var(--hl);color:#2a2a22;box-shadow:0 2px 0 var(--hl2);transform:translateX(-50%) scale(1.3)}
.ghost{position:fixed;left:0;top:0;z-index:60;pointer-events:none;filter:drop-shadow(0 10px 8px rgba(0,0,0,.3));will-change:transform;line-height:0}
.ghost .spr{width:var(--s);height:auto}
.numbered{counter-reset:n}
.numbered .it,.numbered .cell.full{counter-increment:n}
.numbered .it::after,.numbered .cell.full::after{content:counter(n);position:absolute;top:-6px;right:-6px;background:var(--accent);color:#fff;font:800 15px/26px var(--font-ui);min-width:26px;height:26px;text-align:center;border-radius:13px;box-shadow:0 2px 0 var(--accent2);z-index:3}
.spawn{touch-action:none;cursor:grab;display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 14px 8px;border-radius:18px;background:var(--soft);border:3px solid var(--edge);box-shadow:0 5px 0 var(--edge);line-height:1}
.spawn .spr{width:calc(var(--s) * 1.1)}
.spawn span{font:800 12px var(--font-ui);letter-spacing:1px;text-transform:uppercase;color:var(--muted)}
.target{font:800 clamp(64px,10vw,104px)/1 var(--font-ui);color:var(--accent);min-width:90px;text-align:center}
.arrow{width:42px;color:var(--edge2);flex:none}
.op{font:800 clamp(40px,6vw,60px) var(--font-ui);color:var(--accent)}
.frames{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.frame{display:grid;grid-template-columns:repeat(5,var(--c,min(62px,14vw)));gap:6px;padding:8px;background:var(--edge2);border-radius:16px}
.cell{width:var(--c,min(62px,14vw));aspect-ratio:1;background:var(--panel);border-radius:10px;display:grid;place-items:center;position:relative;box-sizing:border-box}
.cell .spr{width:76%;height:auto}
.cell.tapme{cursor:pointer;border:2px dashed var(--edge2)}
.cell.full.tapme{border-style:solid;border-color:transparent}
.cell.lock{cursor:default}
.cell.gone{opacity:.3}
.seq{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.ntile{width:clamp(70px,11vw,96px);aspect-ratio:1;border-radius:16px;display:grid;place-items:center;font:800 clamp(36px,6vw,52px) var(--font-ui);background:var(--soft);border:3px solid var(--edge);box-shadow:0 5px 0 var(--edge)}
.ntile.q{border-style:dashed;color:var(--muted)}
.bigword{font:800 clamp(44px,8vw,80px)/1 var(--font-ui);color:var(--accent);letter-spacing:1px}
.sum{font:800 clamp(44px,8vw,80px)/1 var(--font-ui);letter-spacing:2px;font-variant-numeric:tabular-nums;text-align:center}
.track{display:flex;gap:4px;flex-wrap:wrap;justify-content:center;max-width:860px}
.track span{width:38px;height:38px;border-radius:9px;display:grid;place-items:center;font:800 18px var(--font-ui);background:var(--soft);color:var(--muted)}
.track span.on{background:var(--hl);color:#2a2a22}
#helpbox:empty{display:none}
#helpbox{display:flex;flex-direction:column;align-items:center;gap:10px;background:var(--soft);border-radius:18px;padding:14px;max-width:100%;box-sizing:border-box}
#helpbox .hl{font:800 14px var(--font-ui);letter-spacing:1px;text-transform:uppercase;color:var(--muted)}
.tools{display:flex;gap:12px;justify-content:center}
.tools:empty,.qa:empty,.fb:empty{display:none}
.qa{display:flex;flex-direction:column;align-items:center;gap:14px}
.choices{display:flex;flex-wrap:wrap;gap:16px;justify-content:center}
.pick{min-width:96px;height:96px;padding:0 16px;border-radius:22px;border:4px solid var(--edge2);background:var(--panel);font:800 46px var(--font-ui);color:var(--ink);box-shadow:0 6px 0 var(--edge2);transition:opacity .3s}
.pick:active{transform:translateY(4px);box-shadow:0 2px 0 var(--edge2)}
.pick.word{font-size:28px}
.pick.dim,.opt.dim{opacity:.28;pointer-events:none}
.pick.glow,.opt.glow{box-shadow:0 0 0 6px var(--hl),0 6px 0 var(--hl2);animation:pulse 1.4s ease-in-out infinite}
.pick.right,.opt.right{background:var(--hl);border-color:var(--hl2);color:#2a2a22;box-shadow:0 6px 0 var(--hl2);animation:none}
.opt{border:4px solid var(--edge2);background:var(--panel);border-radius:22px;padding:12px;box-shadow:0 6px 0 var(--edge2);max-width:100%;color:var(--ink)}
.opt:active{transform:translateY(3px)}
.opt .zone{pointer-events:none}
.opt.num{min-width:120px;font:800 64px var(--font-ui)}
.fb{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.yes{font:800 clamp(28px,4vw,40px) var(--font-ui);color:var(--accent)}
.soft-note{font:700 20px/1.35 var(--font-ui);color:var(--muted);max-width:640px}
.sayit{display:flex;flex-direction:column;align-items:center;gap:10px;background:var(--soft);border-radius:20px;padding:16px 22px}
.sayit p{margin:0;font:800 20px var(--font-ui);color:var(--muted)}

};
const TP={};
function tilePix(t){const key=t.n+t.c;if(TP[key])return TP[key];const r=seeded(hash(key)),g=[];for(let y=0;y<8;y++){g[y]=[];for(let x=0;x<8;x++)g[y][x]=t.c}
  const set=(x,y,c)=>{if(x>=0&&x<8&&y>=0&&y<8)g[y][x]=c};
  switch(t.p){
    case'grass':for(let x=0;x<8;x++){set(x,0,t.l);set(x,1,t.l);if(r()<.5)set(x,2,t.l)}for(let i=0;i<6;i++)set(R0(r),3+R0(r,5),t.d);break;
    case'specks':for(let i=0;i<9;i++)set(R0(r),R0(r),t.d);for(let i=0;i<5;i++)set(R0(r),R0(r),t.l);break;
    case'planks':for(let x=0;x<8;x++){set(x,3,t.d);set(x,7,t.d);set(x,0,t.l);set(x,4,t.l)}set(2,1,t.d);set(2,2,t.d);set(6,5,t.d);set(6,6,t.d);break;
    case'leaves':for(let i=0;i<16;i++)set(R0(r),R0(r),r()<.5?t.l:t.d);break;
    case'glass':for(let i=0;i<8;i++){set(i,0,t.d);set(i,7,t.d);set(0,i,t.d);set(7,i,t.d)}set(2,2,t.l);set(3,2,t.l);set(2,3,t.l);set(5,4,t.l);break;
    case'bricks':for(let x=0;x<8;x++){set(x,3,t.l);set(x,7,t.l)}[1,2].forEach(y=>set(3,y,t.l));[0,1,2].forEach(y=>set(7,y,t.l));[4,5,6].forEach(y=>{set(1,y,t.l);set(5,y,t.l)});break;
    case'shiny':for(let i=0;i<8;i++){set(i,7,t.d);set(7,i,t.d)}set(1,1,t.l);set(2,1,t.l);set(1,2,t.l);set(4,4,t.l);break;
    case'panel':for(let i=0;i<8;i++){set(i,0,t.l);set(0,i,t.l);set(i,7,t.d);set(7,i,t.d)}set(1,1,t.d);set(6,1,t.d);set(1,6,t.d);set(6,6,t.d);break;
    case'star':set(3,1,t.l);set(4,1,t.l);for(let x=1;x<7;x++)set(x,3,t.l);for(let x=2;x<6;x++){set(x,2,t.l);set(x,4,t.l)}set(2,5,t.l);set(5,5,t.l);set(1,6,t.l);set(6,6,t.l);break;
    case'light':for(let y=2;y<6;y++)for(let x=2;x<6;x++)set(x,y,t.l);for(let i=0;i<8;i++){set(i,7,t.d);set(7,i,t.d)}break;
    case'rails':for(let x=0;x<8;x++){set(x,0,t.l);set(x,1,'#8a8e92')}[0,4].forEach(x=>{set(x,2,t.d);set(x+1,2,t.d);set(x+2,2,t.d)});for(let i=0;i<7;i++)set(R0(r),3+R0(r,5),'#7d7368');break;
    case'water':for(let x=0;x<8;x++)if((x+0)%4<2)set(x,1,t.l);for(let x=0;x<8;x++)if((x+2)%4<2)set(x,5,t.l);for(let i=0;i<4;i++)set(R0(r),R0(r),t.d);break;
    case'lava':for(let i=0;i<14;i++)set(R0(r),R0(r),r()<.5?t.l:t.d);break;
    case'spots':for(let i=0;i<6;i++)set(R0(r),R0(r),t.d);for(let i=0;i<8;i++){set(i,7,t.d)}set(2,1,t.l);break;
  }
  return TP[key]=g}
function R0(r,n=8){return Math.floor(r()*n)}
function drawTile(ctx,t,x,y,s){const g=tilePix(t),u=s/8;for(let j=0;j<8;j++)for(let i=0;i<8;i++){ctx.fillStyle=g[j][i];ctx.fillRect(Math.floor(x+i*u),Math.floor(y+j*u),Math.ceil(u),Math.ceil(u))}}
function tileCanvas(t,size=32){const c=document.createElement('canvas');c.width=size;c.height=size;drawTile(c.getContext('2d'),t,0,0,size);return c}

  if(id==='moreless'){const[lo,hi]=[[1,5],[2,9],[8,19]][b-1],n=band(lo,hi),dir=n<=1?'more':pick(['more','less']),t=dir==='more'?n+1:n-1;

    return{sig:'oA'+n+dir,mode:'choose',text:`One ${dir} than ${n} is…`,say:`One ${dir} than ${word(n)} is what?`,html:`<div class="board"><div class="sum">${dir==='more'?`${n} + 1`:`${n} − 1`}</div></div>`,q:{ans:t,ch:choices(t,0,hi+2)},pic:track(Math.max(10,Math.min(20,n+3)),[n]),sayIt:{show:`One ${dir} than ${n} is ${t}`,say:`One ${dir} than ${word(n)} is ${word(t)}`}}}

  if(id==='compare'){const hi=[5,10,20][b-1];let a=R(1,hi),c=R(1,hi);if(b===1)while(c===a)c=R(1,hi);else if(Math.random()<.18)c=a;else while(c===a)c=R(1,hi);
    const want=pick(['more','fewer']),ans=a===c?'S':(want==='more'?(a>c?'L':'R'):(a<c?'L':'R')),same=b>1?'<button class="btn soft" data-pick="S">The same</button>':'';
    const opt=(k,inner)=>`<button class="opt" data-pick="${k}">${inner}</button>`;
    if(st==='C'){return{sig:'kC'+a+c+want,s:Math.max(a,c)+3,mode:'choose',text:`Which ${B} has ${want}?`,
      html:`<div class="board" style="flex-direction:column">${opt('L',`<div class="zone box line"><div class="zin">${its(a,v,'fixed')}</div></div>`)}${opt('R',`<div class="zone box line"><div class="zin">${its(c,v2,'fixed')}</div></div>`)}</div>`,
      q:{ans,custom:true,extra:same},helpGroups:['[data-pick=L] .it','[data-pick=R] .it']}}
    if(st==='P'||hi<=10&&st!=='A'){const tot=Math.max(a,c)<=5?5:Math.max(a,c)<=10?10:20;return{sig:'kP'+a+c+want,s:10,mode:'choose',text:`Which has ${want}?`,
      html:`<div class="board">${opt('L',frameHTML(tot,a,{v}))}${opt('R',frameHTML(tot,c,{v:v2}))}</div>`,q:{ans,custom:true,extra:same},helpGroups:['[data-pick=L] .cell.full','[data-pick=R] .cell.full']}}
    if(a===c)c=a===hi?a-1:a+1;const big=want==='more'?'bigger':'smaller',ansA=want==='more'?(a>c?'L':'R'):(a<c?'L':'R');
    return{sig:'kA'+a+c+want,mode:'choose',text:`Which number is ${big}?`,html:'',q:{ans:ansA,custom:true,opts:`<div class="choices">${opt('L',a).replace('class="opt"','class="opt num"')}${opt('R',c).replace('class="opt"','class="opt num"')}</div>`},
      pic:track(Math.max(10,Math.min(20,Math.max(a,c)+1)),[a,c])}}

  if(id==='add'){const t=[5,10,20][b-1],s=R(2,t),a=R(1,s-1),c=s-a;const sy={show:`${a} + ${c} = ${s}`,say:`${word(a)} add ${word(c)} makes ${word(s)}`};
    if(st==='C')return{sig:'aC'+a+c,s:s,mode:'drag',text:`Put them all in the ${th.big}.`,
      html:`<div class="board">${zone('a','box sm','',its(a,v,'','a'))}<div class="op">+</div>${zone('c','box sm','',its(c,v2,'','c'))}</div><div class="board">${zone('big','box',th.big)}</div>`,
      tapTo:(f,it)=>f==='big'?it.dataset.home:'big',accept:(f,to,it)=>to==='big'||(it&&to===it.dataset.home),countAloud:'big',auto:()=>cnt('a')+cnt('c')===0,collapse:['a','c'],
      q:{text:`How many ${M} altogether?`,ans:s,ch:choices(s,0,t+2)},helpSel:'[data-z=big] .it',sayIt:sy};
    const picH=`<div class="board">${zone('pa','box sm','',its(a,v,'fixed'))}<div class="op">+</div>${zone('pc','box sm','',its(c,v2,'fixed'))}</div>`;

  if(id==='take'){const t=[5,10,20][b-1],n=R(2,t),k=R(1,n-1),l=n-k;const sy={show:`${n} − ${k} = ${l}`,say:`${word(n)} take away ${word(k)} leaves ${word(l)}`};
    if(st==='C')return{sig:'tC'+n+k,s:n,mode:'drag',text:`Take ${k} out of the ${B}.`,
      html:`<div class="board">${zone('box','box',B,its(n,v))}${ARROW}${zone('out','tray','Out')}</div>`,

    const picH=`<div class="board">${zone('p','box','',its(l,v,'fixed')+its(k,v,'fixed gone'))}</div>`;

  if(id==='bonds'){const t=[5,10,10][b-1],a=R(1,t-1),m=t-a;const sy={show:`${a} + ${m} = ${t}`,say:`${word(a)} and ${word(m)} make ${word(t)}`};

      html:`<div class="board"><div class="sum">${left?`? + ${m2}`:`${a2} + ?`} = ${T2}</div></div>`,q:{ans:left?a2:m2,ch:choices(left?a2:m2,0,T2)},pic:frameHTML(T2,left?m2:a2,{v}),picSel:'#helpbox .cell:not(.full)',
      sayIt:{show:`${a2} + ${m2} = ${T2}`,say:`${word(a2)} and ${word(m2)} make ${word(T2)}`}}}

function card(html,cls=''){$('#stage').innerHTML=`<section class="card ${cls}" id="card">${html}</section>`;$('#card').scrollTop=0}

function applyTheme(){document.body.dataset.theme=DB.theme;document.body.classList.toggle('still',still());$('#skyL').innerHTML=sceneSky(DB.theme);$('#groundL').innerHTML=sceneGround(DB.theme);

const SPEAK='<svg viewBox="0 0 24 24" fill="#fff"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round"/></svg>';

function startSession(id){const k=SK.find(x=>x.id===id);hush();S={k,n:DB.jobs,i:0,done:0,first:0,breaks:0,breakMs:0,t0:Date.now(),ups:[],seen:new Set(),found:[]};buildOpen=false;DB.buildUntil=0;save();nextJob()}
function nextJob(){if(S.i>=S.n)return finish();const s=sk(S.k.id),lv=LADDER[Math.min(s.step,LADDER.length-1)];let r,t=0;
  do{r=gen(S.k.id,lv[0],lv[1]);t++}while(S.seen.has(r.sig)&&t<15);S.seen.add(r.sig);
  J={r,lv,miss:0,shown:false,locked:false,phase:r.mode==='choose'?'q':'do',busy:false};CUR=null;hdr({home:1,dots:1,brk:1});renderJob()}
function renderJob(){const r=J.r,[b,st]=J.lv,stI={C:0,P:1,A:2}[st];
  card(`<div class="jobtop"><div class="lvl">${esc(S.k.name)} · ${STAGE[st]} ${[0,1,2].map(i=>`<i class="${i<=stI?'on':''}"></i>`).join('')}</div><div class="buddy" id="buddy" aria-hidden="true">${friendSvg(friendsOf()[haveN()-1])}</div></div>
    ${promptHTML(r.text,r.say,'ptext')}

  ${TAB==='settings'?settingsHTML():TAB==='progress'?progressHTML():reportTabHTML()}`;if(TAB==='settings')fillVoices()}
function settingsHTML(){return`
  <div class="two"><div class="field"><label for="sChild">Child's name</label><input id="sChild" maxlength="24" value="${esc(DB.child)}" placeholder="Their name"></div><div class="field"><label for="sHelper">They call you</label><input id="sHelper" maxlength="24" value="${esc(DB.helper)}" placeholder="Mum, Dad…"></div></div>

  <h3>Sound and voice</h3>
  <div class="set"><b>Sounds</b>${segHTML('sound',[[true,'On'],[false,'Off']])}</div>
  <div class="set"><b>Voice</b>${segHTML('voice',[[true,'On'],[false,'Off']])}${segHTML('pack',[...PACKS,['device',"This device's voice"]])}<div class="set" id="deviceVoice" ${DB.pack==='device'?'':'hidden'}><select id="voicePick" aria-label="Choose a device voice"></select>${segHTML('rate',[['slow','Slower'],['normal','Normal']])}<span>On iPhone and iPad, extra natural voices can be downloaded in Settings › Accessibility › Spoken Content › Voices.</span></div><button class="btn soft" data-act="testvoice" style="min-height:44px;font-size:16px;align-self:flex-start">Test the voice</button><span>Amelia and Chris are recorded voices. They download once and then work without WiFi.</span></div>
  <h3>Reading and talking</h3>
  <div class="set"><b>Reading</b>${segHTML('reading',[['all','Read everything'],['tap','Tap to hear'],['try','Have a go first']])}</div>
  <div class="set"><b>"Can you say it?"</b>${segHTML('sayit',[['off','Off'],['some','Sometimes'],['all','Every time']])}</div>
  <div class="set"><b>Record their voice and play it back</b>${segHTML('record',[[false,'Off'],[true,'On']])}<span>Hearing themselves can really help. Recordings play once and are never saved or sent anywhere.</span></div>
  <h3>Senses</h3>
  <div class="set"><b>Celebrations</b>${segHTML('party',[['big','Big'],['small','Small'],['quiet','Quiet']])}</div>
  <div class="set"><b>Movement</b>${segHTML('motion',[['full','Full'],['gentle','Gentle']])}</div>
  <h3>Jobs, breaks and building</h3>
  <div class="set"><b>Jobs each time</b>${segHTML('jobs',[[3,'3'],[5,'5'],[8,'8']])}</div>
  <div class="set"><b>A new friend every</b>${segHTML('every',[[1,'job'],[3,'3 jobs'],[5,'5 jobs']])}<span>Friends are the reward for doing maths. There are 48 to find in each world.</span></div>
  <div class="set"><b>Break style</b>${segHTML('breakStyle',[['watch','Just watch'],['breathe','Breathe with me'],['still','Quiet and still']])}<span>"Just watch" shows a block gently growing and shrinking, with no instructions. Some children find being told how to breathe uncomfortable.</span></div>
  <div class="set"><b>Break length</b>${segHTML('breakMin',[[1,'1 min'],[2,'2 min'],[3,'3 min'],[5,'5 min']])}<span>Breaks are always allowed. They're a quiet rest, not a game, and each one shows in the report.</span></div>
  <div class="set"><b>Build time limit</b>${segHTML('buildMin',[[0,'Off'],[5,'5 min'],[10,'10 min'],[15,'15 min'],[20,'20 min']])}<span>A small timer shows while they build, with a warning at one minute and a calm finish screen.</span></div>
  <div class="set"><b>Tower challenges</b>${segHTML('chalOn',[[true,'On'],[false,'Off']])}</div>
  <div class="set"><b>TNT</b>${segHTML('tnt',[[true,'On'],[false,'Off']])}<span>Turn off if booms and shaking are too much.</span></div>
  <div class="set"><b>Build time</b>${segHTML('buildWhen',[['after','After jobs'],['any','Any time']])}<span>Building is unlimited. Build time opens once they've found a friend.</span></div>
  <div class="privacy">Our promise: no ads, no accounts, no WiFi needed. Everything stays private on this device. Nothing is ever sent anywhere.</div>
  <button class="btn soft danger" data-act="reset" style="min-height:48px;font-size:16px">Start again from scratch</button>`}
function fillVoices(){const sel=$('#voicePick');if(!sel)return;loadVoices();const cur=pickVoice();sel.innerHTML=VOICES.length?VOICES.map(v=>`<option value="${esc(v.name)}"${cur&&v.name===cur.name?' selected':''}>${esc(v.name)} (${esc(v.lang)})</option>`).join(''):'<option>Default voice</option>';sel.onchange=()=>{DB.voiceName=sel.value;save();say('Hello! Shall we do some maths?',{tap:true})}}
function saveSheetNames(){const c=$('#sChild'),h=$('#sHelper');if(c){DB.child=c.value.trim().slice(0,24);DB.helper=h.value.trim().slice(0,24);save()}}
function statusText(k){const s=sk(k.id),st=s.step;if(!s.done&&!st)return'Not started yet.';if(st>=LADDER.length)return`Secure with ${k.range[2]}, using objects, pictures and numbers.`;
  const lastIdx=b=>LADDER.map(x=>x[0]).lastIndexOf(b);let sb=0;for(let b=1;b<=3;b++)if(st>lastIdx(b))sb=b;const[b,g]=LADDER[st];
  return(sb?`Secure with ${k.range[sb-1]}. `:'')+`Working on ${k.range[b-1]}, ${STAGE_DESC[g]}.`}
function progressHTML(){return`<span style="color:#66675c;font-weight:600;font-size:14px;line-height:1.4">Levels move up after three first-try answers in a row and gently step back if something is tricky. You can move them yourself too.</span>`+
  SK.map((k,i)=>{const s=sk(k.id),pc=Math.round(100*s.step/LADDER.length);return`<div class="prow"><b>${k.name}${unlocked(i)?'':' <span style="color:#999;font-weight:700">· locked</span>'}</b><div class="adj"><button data-act="lv" data-k="${k.id}" data-d="-1" aria-label="Level down">−</button><button data-act="lv" data-k="${k.id}" data-d="1" aria-label="Level up">+</button></div><div class="bar"><i style="width:${pc}%"></i></div><p>${statusText(k)}</p></div>`}).join('')}
function sums(days=30){const since=Date.now()-days*864e5,ss=DB.sessions.filter(x=>x.d>=since),lg=DB.log.filter(x=>x.d>=since);
  return{ss,n:ss.length,jobs:lg.length,first:lg.length?Math.round(100*lg.filter(x=>x.f).length/lg.length):0,breaks:ss.reduce((a,x)=>a+x.breaks,0),breakMs:ss.reduce((a,x)=>a+x.breakMs,0),mins:Math.round(ss.reduce((a,x)=>a+x.ms,0)/6e4),lg}}
function reportTabHTML(){const m=sums(30);return`<div class="stats"><div class="stat"><b>${m.n}</b><span>sessions (30 days)</span></div><div class="stat"><b>${m.jobs}</b><span>jobs done</span></div><div class="stat"><b>${m.first}%</b><span>right first time</span></div><div class="stat"><b>${m.breaks}</b><span>breaks taken</span></div></div>
  <span style="color:#66675c;font-weight:600;font-size:14px;line-height:1.4">A plain-English summary matched to EYFS and Year 1 goals. Useful as evidence of learning, or to bring to an EHCP meeting.</span>
  <button class="btn" data-act="report" style="background:#23241f;box-shadow:none;color:#fff">Open the report</button>`}
function fmtDate(d){return new Date(d).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'})}
function showReport(){const m=sums(30),name=DB.child||'Your child',sk30=k=>{const l=m.lg.filter(x=>x.k===k.id);return l.length?`${l.length} jobs, ${Math.round(100*l.filter(x=>x.f).length/l.length)}% first time`:'—'};
  const avgBreak=m.breaks?Math.max(1,Math.round(m.breakMs/m.breaks/6e4)):0;
  $('#reportView').innerHTML=`<div class="rbar"><button data-act="closereport">Back</button><button class="pri" data-act="print" id="pdfBtn">Save or share PDF</button></div>
  <div class="doc"><h1>${esc(name)}: maths learning summary</h1><p class="meta">Little Easier – Maths · ${fmtDate(Date.now()-30*864e5)} to ${fmtDate(Date.now())}${DB.helper?` · Prepared by ${esc(DB.helper)}`:''}</p>
  <h2>At a glance</h2><div class="stats"><div class="stat"><b>${m.n}</b><span>sessions</span></div><div class="stat"><b>${m.mins}</b><span>minutes of maths</span></div><div class="stat"><b>${m.jobs}</b><span>jobs completed</span></div><div class="stat"><b>${m.first}%</b><span>right first time</span></div><div class="stat"><b>${m.breaks}</b><span>breaks${m.breaks?`, about ${avgBreak} min each`:''}</span></div></div>
  <h2>Where ${esc(name)} is now</h2><table><tbody>${SK.map(k=>`<tr><th>${k.name}</th><td>${statusText(k)}<br><span style="color:#66675c;font-size:13px">Last 30 days: ${sk30(k)}</span></td><td class="cur">${k.cur}</td></tr>`).join('')}</tbody></table>
  <h2>Recent sessions</h2>${m.ss.length?`<table><thead><tr><th>Date</th><th>Jobs</th><th>Done</th><th>First time</th><th>Breaks</th></tr></thead><tbody>${m.ss.slice(0,12).map(s=>`<tr><td class="num">${fmtDate(s.d)}</td><td>${SK.find(k=>k.id===s.k)?.name||''}</td><td class="num">${s.done} of ${s.n}${s.early?' (stopped early)':''}</td><td class="num">${s.first}</td><td class="num">${s.breaks}</td></tr>`).join('')}</tbody></table>`:'<p>No sessions yet.</p>'}
  <h2>How ${esc(name)} learns here</h2><p>Each skill moves through three stages: hands-on (moving real objects on screen), pictures (ten frames and groups), then numbers only. This follows the concrete–pictorial–abstract approach used in UK schools. Mistakes are never marked as wrong: a first miss shows a picture or counts along together, and a second miss shows the answer. Breaks are always allowed and are recorded above.</p>
  <h2>Notes</h2><div class="lines"></div>
  <p class="foot">Made on this device with Little Easier – Maths (littleeasier.co.uk). Nothing in this report has been shared or uploaded.</p></div>`;$('#reportView').hidden=false;$('#reportView').scrollTop=0}

/* ---------- PDF report, built on the device (no printing needed) ---------- */
function loadJsPdf(){return window.jspdf?Promise.resolve():new Promise((res,rej)=>{const sc=document.createElement('script');sc.src='jspdf.min.js';sc.onload=res;sc.onerror=rej;document.head.appendChild(sc)})}
const pdfSafe=t=>String(t).replace(/−/g,'-').replace(/[‘’]/g,"'").replace(/[“”]/g,'"').replace(/…/g,'...').replace(/[^\x20-\x7E -ÿ–—·£]/g,'');
async function makePdf(btn){const lab=btn.textContent;btn.textContent='Making the PDF…';btn.disabled=true;
  try{await loadJsPdf();const{jsPDF}=window.jspdf,d=new jsPDF({unit:'mm',format:'a4'}),W=210,M=16,CW=W-M*2;let y=M;const m=sums(30),name=DB.child||'Your child';
    const ink=[31,32,27],mut=[102,103,92],line=[221,218,206],acc=[63,122,34];
    const need=h=>{if(y+h>297-M){d.addPage();y=M}};
    const txt=(t,x,size,opt={})=>{d.setFont('helvetica',opt.bold?'bold':'normal');d.setFontSize(size);d.setTextColor(...(opt.col||ink));const lines=d.splitTextToSize(pdfSafe(t),opt.w||CW);d.text(lines,x,y+size*.35);return lines.length*size*.42};
    const h2=t=>{need(14);y+=6;d.setDrawColor(...line);d.setLineWidth(.4);txt(t.toUpperCase(),M,10,{bold:true,col:mut});y+=5;d.line(M,y,W-M,y);y+=4};
    d.setFillColor(...acc);d.rect(0,0,W,4,'F');y=M+2;
    y+=txt(`${name}: maths learning summary`,M,18,{bold:true})+2;
    y+=txt(`Little Easier – Maths · ${fmtDate(Date.now()-30*864e5)} to ${fmtDate(Date.now())}${DB.helper?` · Prepared by ${DB.helper}`:''}`,M,10,{col:mut})+2;
    h2('At a glance');const avg=m.breaks?Math.max(1,Math.round(m.breakMs/m.breaks/6e4)):0;
    const st=[[m.n,'sessions'],[m.mins,'minutes of maths'],[m.jobs,'jobs completed'],[m.first+'%','right first time'],[m.breaks,m.breaks?`breaks, ~${avg} min each`:'breaks']],bw=(CW-4*3)/5;
    need(20);st.forEach(([v,l],i)=>{const x=M+i*(bw+3);d.setFillColor(241,239,230);d.roundedRect(x,y,bw,18,2,2,'F');d.setFont('helvetica','bold');d.setFontSize(15);d.setTextColor(...ink);d.text(String(v),x+3,y+8);d.setFont('helvetica','normal');d.setFontSize(7.5);d.setTextColor(...mut);d.text(d.splitTextToSize(l,bw-5),x+3,y+13)});y+=24;
    h2(`Where ${name} is now`);
    SK.forEach(k=>{const l=m.lg.filter(x=>x.k===k.id),last=l.length?`Last 30 days: ${l.length} jobs, ${Math.round(100*l.filter(x=>x.f).length/l.length)}% right first time`:'Last 30 days: no jobs yet';
      d.setFont('helvetica','normal');d.setFontSize(9.5);const a=d.splitTextToSize(pdfSafe(statusText(k)),CW*.47),b2=d.splitTextToSize(pdfSafe(k.cur),CW*.33);const h=Math.max(a.length*4+5,b2.length*3.6)+4;need(h+2);
      d.setFont('helvetica','bold');d.setFontSize(10);d.setTextColor(...ink);d.text(d.splitTextToSize(k.name,CW*.18),M,y+3.5);
      d.setFont('helvetica','normal');d.setFontSize(9.5);d.text(a,M+CW*.2,y+3.5);d.setFontSize(8);d.setTextColor(...mut);d.text(pdfSafe(last),M+CW*.2,y+3.5+a.length*4+1);
      d.setFontSize(8);d.text(b2,M+CW*.68,y+3.5);y+=h;d.setDrawColor(...line);d.line(M,y,W-M,y);y+=2});
    h2('Recent sessions');if(!m.ss.length){y+=txt('No sessions yet.',M,10,{col:mut})}else{const cols=[0,.22,.5,.72,.88],hd=['Date','Jobs','Done','First time','Breaks'];need(8);d.setFont('helvetica','bold');d.setFontSize(9);d.setTextColor(...mut);hd.forEach((h,i)=>d.text(h,M+cols[i]*CW,y+3));y+=6;
      d.setFont('helvetica','normal');d.setTextColor(...ink);m.ss.slice(0,14).forEach(s0=>{need(6);const r=[fmtDate(s0.d),(SK.find(k=>k.id===s0.k)||{}).name||'',`${s0.done} of ${s0.n}${s0.early?' (stopped)':''}`,String(s0.first),String(s0.breaks)];r.forEach((v,i)=>d.text(pdfSafe(v),M+cols[i]*CW,y+3));y+=5.5;d.setDrawColor(...line);d.line(M,y,W-M,y);y+=.5})}
    h2(`How ${name} learns here`);y+=txt('Each skill moves through three stages: hands-on (moving objects on screen), pictures (ten frames and groups), then numbers only. This follows the concrete–pictorial–abstract approach used in UK schools. Mistakes are never marked as wrong: a first miss starts counting together, a second counts everything together and highlights the answer. Breaks are always allowed and are recorded above.',M,9.5)+2;
    h2('Notes');need(40);for(let i=0;i<5;i++){y+=8;d.setDrawColor(...line);d.line(M,y,W-M,y)}y+=8;
    need(10);y+=txt('Made on this device with Little Easier – Maths (littleeasier.co.uk). Nothing in this report has been shared or uploaded.',M,8,{col:mut});
    const fname=`Maths summary - ${pdfSafe(name)} - ${fmtDate(Date.now())}.pdf`,blob=d.output('blob'),file=new File([blob],fname,{type:'application/pdf'});
    let shared=false;try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:fname});shared=true}}catch(e){if(e&&e.name==='AbortError')shared=true}
    if(!shared){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=fname;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},5000)}
    btn.textContent='PDF ready';setTimeout(()=>{btn.textContent=lab;btn.disabled=false},1800)}
  catch(e){btn.textContent="Couldn't make the PDF. Try again";btn.disabled=false;setTimeout(()=>btn.textContent=lab,2500)}}

/* ================= actions ================= */
document.addEventListener('click',e=>{const p=e.target.closest('[data-pick]');if(p&&J){choose(p);return}
  const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act;
  switch(a){
    case'start':startSession(b.dataset.k);break;
    case'pickskill':sfx.tap();startSession(b.dataset.k);break;
    case'lockedsk':say('That one opens soon. Keep going!');break;
    case'build':if(canBuild())showBuild();else{say('Build time opens after your jobs.');const t=b.querySelector('span:last-child');if(t)t.textContent='Do your jobs first, then build!'}break;
    case'home':hush();showHome();break;
    case'friends':if(S&&J)break;sfx.tap();showFriends(DB.theme);break;
    case'fbworld':sfx.tap();showFriends(b.dataset.k);break;
    case'fbhop':{const f=friendsOf(FBW)[+b.dataset.i];b.classList.remove('hop');void b.offsetWidth;b.classList.add('hop');tone(520,.08,0,.04,'triangle');tone(780,.12,.08,.035,'triangle');say(f.n+'!',{tap:true});break}
    case'fbhopsp':{const f=specialsOf(FBW)[+b.dataset.i];b.classList.remove('hop');void b.offsetWidth;b.classList.add('hop');tone(620,.08,0,.04,'triangle');tone(930,.12,.08,.035,'triangle');say(f.n+'!',{tap:true});break}
    case'pfhop':{b.style.animation='none';void b.offsetWidth;b.style.animation='bhop2 .6s cubic-bezier(.3,1.6,.5,1)';setTimeout(()=>b.style.animation='',700);tone(520,.08,0,.04,'triangle');tone(780,.12,.08,.035,'triangle');break}
    case'exit':if(S&&J)askStop();else{hush();showHome()}break;
    case'keep':b.closest('.modal').remove();break;
    case'stopjobs':b.closest('.modal').remove();if(S){J.busy=false;finish(true)}break;
    case'speak':readOut(b.dataset.for,true);break;
    case'done':doneTap();break;
    case'next':nextTap();break;
    case'opengift':openGift(b);break;
    case'said':{const box=b.closest('.sayit');box.innerHTML=`<p>Brilliant talking!</p><button class="btn big" data-act="next">${S&&S.i>=S.n-1?'Finish':'Next'}</button>`;sfx.yes();say('Brilliant talking!');break}
    case'hearit':if(J&&J.r.sayIt)say(J.r.sayIt.say,{tap:true});break;
    case'rec':recordEcho(b);break;
    case'break':openBreak();break;
    case'brkback':closeBreak();break;
    case'sound':DB.sound=!DB.sound;save();soundIcon();if(DB.sound)sfx.tap();break;
    case'world':{const ks=Object.keys(THEMES);DB.theme=ks[(ks.indexOf(DB.theme)+1)%ks.length];save();applyTheme();sfx.tap();say(T().name);if(CUR)CUR();break}
    case'pickworld':DB.theme=b.dataset.k;save();applyTheme();say(T().name);showSetup(1);break;
    case'setup0':showSetup(0);break;
    case'setup1':saveNames();showSetup(1);break;
    case'setup1b':showSetup(1);break;
    case'setup2':showSetup(2);break;
    case'setupDone':DB.setup=true;save();showHome();say(DB.child?`Hi ${DB.child}! Ready for some maths?`:'Ready for some maths?');break;
    case'seg':{const key=b.closest('.seg').dataset.key;let v=b.dataset.v;v=v==='true'?true:v==='false'?false:/^\d+$/.test(v)?+v:v;DB[key]=v;save();
      $$('button',b.closest('.seg')).forEach(x=>x.classList.toggle('on',x===b));
      if(key==='theme'||key==='motion')applyTheme();if(key==='sound')soundIcon();if(key==='voice'&&v)say('Voice on.',{tap:true});if(key==='pack'){const dv=$('#deviceVoice');if(dv)dv.hidden=v!=='device';preloadPack();setTimeout(()=>say(`Hello${DB.child?' '+DB.child:''}! Three add four makes seven.`,{tap:true}),300)}break}
    case'tab':saveSheetNames();TAB=b.dataset.k;renderPanel();break;
    case'closepanel':closePanel();break;
    case'testvoice':say(`Hello${DB.child?' '+DB.child:''}! Three add four makes seven.`,{tap:true});break;
    case'lv':{const s=sk(b.dataset.k);s.step=Math.max(0,Math.min(LADDER.length,s.step+(+b.dataset.d)));s.pts=0;s.miss=0;save();renderPanel();break}
    case'report':saveSheetNames();$('#panel').hidden=true;showReport();break;
    case'closereport':$('#reportView').hidden=true;openPanel();break;
    case'print':makePdf(b);break;
    case'reset':if(b.dataset.sure){localStorage.removeItem(KEY);location.reload()}else{b.dataset.sure='1';b.textContent='Tap again to delete everything on this device'}break;

    case'pdig':PL.tool={k:'dig'};markTool();sfx.tap();toast('Tap something to take it away');break;

    case'pideas':showIdeas();sfx.tap();break;
    case'pidea':{const i=+b.dataset.i;$('#pideas').hidden=true;for(const q of bodiesDyn())if(q.le.t!=='friend')Matter.Composite.remove(PL.world,q);for(const q of bodiesDyn()){Matter.Sleeping.set(q,false);Matter.Body.setPosition(q,{x:q.position.x<PL.W/2?PL.ix+PL.cell:PL.ix+PL.iw-PL.cell,y:PL.groundTop-PL.cell*2})}PL.z=1;placeIdea(i,{x:PL.W/2,y:PL.groundTop});setTimeout(savePlay,800);break}

    case'pamb':DB.pamb=DB.pamb===false;save();$('#pambBtn').innerHTML=DB.pamb===false?IC.ambOff:IC.ambOn;if(DB.pamb===false){ambStop();toast('Background sound off')}else{ambStart();toast('Background sound on')}break;
    case'playhome':closePlay();break;
    case'goplay':if(S){logSession(true);S=null;J=null}showBuild();break;
    case'morejobs':startSession(b.dataset.k);break;
  }});
